# Independent project: does not restart or replace the existing runners.
name: codex-pr-review
services:
  codex-review:
    build:
      context: .
      dockerfile: Dockerfile.codex-review
      args:
        CODEX_CLI_VERSION: ${REVIEW_CODEX_VERSION:-0.165.0}
    image: codex-pr-review-runner:local
    container_name: github-codex-review
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Keep Docker's syscall filter, with the namespace calls needed by bubblewrap.
    security_opt:
      - seccomp=./codex-review/seccomp.json
    environment:
      GITHUB_URL: ${GITHUB_URL:?Set GITHUB_URL in .env}
      RUNNER_TOKEN: ${REVIEW_RUNNER_TOKEN:-}
      RUNNER_NAME: ${CODEX_RUNNER_NAME:-codex-pr-review-1}
      CODEX_MODEL: gpt-6-astra
      CODEX_REASONING_EFFORT: high
      GH_CONFIG_DIR: /home/runner/.config/gh
      REVIEW_GITHUB_USER: jacktian8888
    volumes:
      - registration:/runner-state
      - work:/home/runner/_work
      - ./credentials/codex:/home/codex/.codex-auth
      - ./credentials/gh-review:/home/runner/.config/gh
    # Generated CLI helpers and process locks belong to this container only.
    # Keep exec enabled for Codex's helper programs. CLI work runs concurrently.
    tmpfs:
      - /home/codex/.codex/tmp:rw,exec,nosuid,nodev,mode=0700,uid=1002,gid=1002,size=64m
    # No host Docker socket, host network, or privileged mode.
volumes:
  registration:
  work:
